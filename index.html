<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Landing Page de Daniel. Creador de contenido sobre Videojuegos e Ingeniería de Sistemas.">
    <title>Daniel | Gaming & Coding</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

<body>
    <div id="particles-js"></div>
    <div class="glass-container">
        <header class="profile">
            <div class="avatar">
                <!-- Puedes cambiar esta URL por la de tu foto de perfil real -->
                <img src="https://ui-avatars.com/api/?name=Daniel&background=0D8ABC&color=fff&size=150" alt="Avatar de Daniel" id="profile-img">

            <h1 class="glow-text">@Daniel</h1>

        <main class="links-section">
            <a href="https://tiktok.com/@tu_usuario" class="link-btn tiktok" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>

            <a href="https://github.com/tu_usuario" class="link-btn github" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
            
            <a href="https://twitch.tv/tu_usuario" class="link-btn twitch" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-twitch"></i>
                <span>Twitch</span>
            </a>

            <div class="info-card">
                <h3>Sobre mí</h3>
                <p>Estudiante de Ingeniería en Sistemas. Apasionado por el desarrollo de software y los videojuegos. Aquí encontrarás mis proyectos y clips favoritos.</p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2026 Daniel. Creado con ❤️ y Código.</p>
        </footer>
    </div>

    <!-- Librería Particles.js para el fondo interactivo -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>

</html>
